on: [push, pull_request]
name: Test
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test
      run: CGO_ENABLED=0 go test -v ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Checkout code
      uses: actions/checkout@v4
    # pinned, because .golangci.yml sets `default: all` and a newer release
    # can enable a linter nobody chose. see docs/PLAN.md
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - name: Lint
      run: golangci-lint run ./...
